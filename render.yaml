services:
  - type: web
    name: oktogone-studio-planner
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /health
    disk:
      name: planner-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PLANNER_DB
        value: /var/data/planner.db
      - key: PLANNER_ONLINE
        value: '1'
      - key: CDP_USER
        value: cdp
      - key: CDP_PASSWORD
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: MAIL_ENABLED
        value: '0'
      - key: MAIL_FROM
        value: jean-baptiste.guillaume@visiplus.com
      - key: COACH_TEST_EMAIL
        value: guillaume.log@gmail.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_PORT
        value: '587'
