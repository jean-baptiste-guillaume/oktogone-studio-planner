<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oktogone Studio Planner</title><style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#243347;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0}.layout{display:grid;grid-template-columns:244px 1fr;min-height:100vh}aside{background:#15273e;color:#edf4ff;padding:28px 16px}aside h2{font-size:19px;margin:0 12px 28px}.nav{display:block;width:100%;text-align:left;color:#cad8eb;background:transparent;border-radius:10px;padding:13px;margin:4px 0}.nav.active,.nav:hover{background:#304e70;color:white}main{padding:32px;max-width:1300px;width:100%;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}h1{font-size:27px;margin:0 0 6px}h3{margin:0 0 18px}p{color:#6c7b90;line-height:1.5}.muted,.hint{color:#74839a;font-size:13px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:22px;box-shadow:0 4px 18px #18324a09;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}.field label{font-size:13px;font-weight:650;color:#53647b}.field input,.field select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;background:white;color:#243347}.btn{padding:11px 17px;border-radius:9px;background:#216aab;color:white;font-weight:600}.btn.secondary{background:#e9f1fa;color:#255277}.btn.success{background:#198467}.btn:disabled{opacity:.45;cursor:not-allowed}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.pill{display:inline-block;padding:5px 9px;border-radius:30px;background:#e8f1fa;color:#235d87;font-size:12px}.pill.ok{background:#e0f5ea;color:#137647}.pill.warning{background:#fff3d6;color:#825200}.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}.day{min-height:90px;background:#eef3f8;border:1px solid #dce5ef;border-radius:10px;padding:10px;color:#52657b}.day.full{background:#dff3e9;border-color:#8fd2ac}.day.am,.day.pm{background:#e2effe;border-color:#a5c5e8}.day.busy{outline:2px solid #dca66d}.day strong{display:block;font-size:14px}.day span{display:block;font-size:12px;margin-top:12px}.results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.result{padding:17px;border:1px solid #dce5ef;border-radius:12px;background:#fff}.result h3{margin:4px 0 14px}.tag{color:#66798e;font-size:12px;margin-bottom:7px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #edf0f5}.row:last-child{border-bottom:0}.status{border-radius:20px;padding:4px 10px;background:#e8f1fa;font-size:12px}#toast{position:fixed;bottom:22px;right:22px;background:#18344e;color:white;padding:13px 20px;border-radius:9px;display:none;max-width:400px}.empty{padding:25px;text-align:center;color:#718198;background:#f7f9fc;border-radius:10px}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{padding:15px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}aside h2{margin:0 16px 0 0}.nav{width:auto;padding:10px}main{padding:17px}.grid,.three,.results{grid-template-columns:1fr}.cal{gap:4px}.day{min-height:85px;padding:5px}.day span{font-size:10px}}
</style></head><body><div class="layout"><aside><h2>◈ Oktogone<br>Studio Planner</h2><button class="nav active" data-tab="cdp">▦ Planification CDP</button><button class="nav" data-tab="providers">◷ Portail prestataires</button><button class="nav" data-tab="calendars">▤ Agendas & ICS</button><button class="nav" data-tab="about">ⓘ À propos</button></aside><main><header><div><h1 id="title">Planification CDP</h1><div class="hint">Démonstrateur local · données fictives · aucun service externe</div></div></header><div id="content"></div></main></div><div id="toast"></div><script>
const $=id=>document.getElementById(id);let resources=[],tab='cdp',selectedProvider=5,weekOffset=0,lastProposals=[],blackouts=[];const names=id=>resources.find(x=>x.id===id)?.name||'—';
function toast(msg){let e=$('toast');e.textContent=msg;e.style.display='block';setTimeout(()=>e.style.display='none',4000)}
async function api(path,method='GET',body){const opt={method};if(body!==undefined){if(body instanceof FormData)opt.body=body;else{opt.headers={'Content-Type':'application/json'};opt.body=JSON.stringify(body)}}let res=await fetch('/api/'+path,opt);let data=await res.json();if(!res.ok)throw Error(data.detail||'Erreur');return data}
function ymd(date){return [date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-')}
function pretty(s){return new Date(s+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})}
function escapeHTML(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function render(){try{if(tab==='cdp')return renderCDP();if(tab==='providers')return renderProviders();if(tab==='calendars')return renderCalendars();$('content').innerHTML='<div class="card"><h3>À propos du POC</h3><p>POC V3 local. SQLite, pré-réservations par projet et confirmation coach simulée. Aucune connexion externe.</p></div>'}catch(e){toast(e.message)}}
async function renderCDP(){let projects=await api('projects');$('content').innerHTML='<section class="card"><h3>Planifier une production</h3><div class="field"><label>Projet · formateur · RF</label><select id="project">'+projects.map(p=>'<option value="'+p.id+'">'+escapeHTML(p.id+' · '+p.name+' · '+p.trainer+' · RF '+p.rf)+'</option>').join('')+'</select></div><div class="grid"><div class="field"><label>Date de planification</label><input id="planning" type="date" value="2026-11-05"></div><div class="field"><label>Préparation minimum</label><select id="months"><option value="1">1 mois</option><option value="2" selected>2 mois</option><option value="3">3 mois</option></select></div><div class="field"><label>Répétitions</label><select id="repeat"><option>1</option><option>2</option></select></div><div class="field"><label>Coach préféré (facultatif)</label><select id="coachPref"><option value="">Aucune préférence</option>'+resources.filter(r=>r.kind==='coach').map(r=>'<option value="'+r.id+'">'+escapeHTML(r.name)+'</option>').join('')+'</select></div><div class="field"><label>Fin de recherche</label><input id="endSearch" type="date" value="2027-04-30"></div></div><p>Deux journées consécutives. Dernière répétition 7 à 14 jours avant le tournage. Une option remplace uniquement les réservations de ce projet.</p><button class="btn" id="simulate">Simuler les 3 premières combinaisons</button></section><section id="choices" class="results"></section><section class="card" id="summary"></section>';$('simulate').onclick=async()=>{try{let opts=await api('simulate','POST',{project_id:$('project').value,planning_day:$('planning').value,months:+$('months').value,repeats:+$('repeat').value,preferred_coach_id:+$('coachPref').value||null,to_day:$('endSearch').value});$('choices').innerHTML=opts.length?opts.map((p,i)=>'<div class="card">'+proposalHTML(p)+'<p>Syllabus : '+p.milestones.syllabus+'<br>Sample : '+p.milestones.sample+'<br>Annexes : '+p.milestones.resources+'</p>'+(p.preparation_started_before_planning?'<p>Attention : ce délai suppose un syllabus déjà déposé. Choisissez 3 mois pour un démarrage complet.</p>':'')+'<button class="btn" onclick="reserveV3('+i+')">Pré-réserver et solliciter le coach</button></div>').join(''):'<p>Aucune combinaison disponible.</p>'}catch(e){toast(e.message)}};$('project').onchange=()=>{$('choices').innerHTML='';summaryV3()};await summaryV3()}
async function reserveV3(i){try{let result=await api('projects/'+$('project').value+'/reserve/'+i,'POST');toast({sent:'Email envoyé au coach',disabled:'Envoi mail désactivé : mode local',failed:'Email non envoyé. Vérifiez la configuration SMTP puis réessayez.'}[result.mail_status]||result.mail_status);$('choices').innerHTML='';await summaryV3()}catch(e){toast(e.message)}}
async function coachV3(d){try{await api('projects/'+$('project').value+'/coach/'+d,'POST');await summaryV3();if(d==='refuse')$('simulate').click()}catch(e){toast(e.message)}}
async function retryMailV3(){try{let r=await api('projects/'+$('project').value+'/retry-mail','POST');toast({sent:'Email envoyé',disabled:'Envoi mail désactivé',failed:'Échec SMTP : vérifier la configuration'}[r.mail_status]||r.mail_status)}catch(e){toast(e.message)}}
async function summaryV3(){let x=await api('projects/'+$('project').value+'/summary');$('summary').innerHTML='<h3>Récapitulatif · '+escapeHTML(x.status)+'</h3>'+(x.status==='pending'?'<button class="btn success" onclick="coachV3(&quot;accept&quot;)">Simuler acceptation coach</button> <button class="btn secondary" onclick="coachV3(&quot;refuse&quot;)">Simuler refus coach</button>':'')+'<button class="btn secondary" onclick="retryMailV3()">Envoyer / renvoyer le mail coach</button><p>Export structuré pour Moockapp · aucune synchronisation active</p><button class="btn secondary" id="exportJSON">Télécharger le récapitulatif JSON</button><pre style="white-space:pre-wrap">'+escapeHTML(JSON.stringify(x,null,2))+'</pre>';$('exportJSON').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(x,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download=x.project.id+'.json';a.click();URL.revokeObjectURL(u)}}
function proposalHTML(p){return `<div class="result"><div class="tag">CRÉNEAU DISPONIBLE · ${names(p.studio_id)}</div><h3>${p.shoots.map(pretty).join(' + ')}</h3><div class="row"><span>Répétition</span><b>${p.repetitions.map(pretty).join(', ')}</b></div><div class="row"><span>Maquillage</span><b>${names(p.makeup_id)}</b></div><div class="row"><span>Coach</span><b>${names(p.coach_id)}</b></div><p>${p.reasons.join(' · ')}</p></div>`}
async function renderProviders(){let c=$('content');c.innerHTML=`<section class="card"><h3>Déclarer et modifier mes disponibilités</h3><div class="toolbar"><div class="field"><label>Profil (simulation)</label><select id="provider">${resources.filter(r=>['makeup','coach','trainer'].includes(r.kind)).map(r=>`<option value="${r.id}" ${r.id===selectedProvider?'selected':''}>${r.name} — ${r.kind}</option>`)}</select></div><div><button id="prevWeek" class="btn secondary">← Semaine précédente</button> <button id="nextWeek" class="btn secondary">Semaine suivante →</button></div></div><h3 id="weekLabel"></h3><div id="providerDays" class="cal"></div><p class="hint">Cliquez sur une journée : journée entière → indisponible → matin → après-midi → journée entière. Les cadres orange indiquent une occupation existante. Les modifications sont enregistrées immédiatement dans SQLite.</p></section>`;$('provider').onchange=e=>{selectedProvider=+e.target.value;drawProviderWeek()};$('prevWeek').onclick=()=>{weekOffset--;drawProviderWeek()};$('nextWeek').onclick=()=>{weekOffset++;drawProviderWeek()};await drawProviderWeek()}
async function drawProviderWeek(){let data=await api('availability/'+selectedProvider);let base=new Date('2026-11-09T12:00:00');base.setDate(base.getDate()+7*weekOffset);$('weekLabel').textContent=`Semaine du ${base.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}`;let html='';for(let i=0;i<5;i++){let d=new Date(base);d.setDate(base.getDate()+i);let key=ymd(d),slot=data.days.find(a=>a.day===key)?.slot||'none';let busy=data.busy.some(b=>b.start.slice(0,10)<=key&&b.end.slice(0,10)>=key&&new Date(b.end)>new Date(key+'T09:00:00'));html+=`<button class="day ${slot} ${busy?'busy':''}" data-day="${key}" data-slot="${slot}"><strong>${d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric'})}</strong><span>${{none:'Indisponible',full:'Journée entière',am:'Matin',pm:'Après-midi'}[slot]}</span></button>`}$('providerDays').innerHTML=html;document.querySelectorAll('.day').forEach(el=>el.onclick=async()=>{try{let next={full:'none',none:'am',am:'pm',pm:'full'}[el.dataset.slot];await api('availability','PUT',{resource_id:selectedProvider,day:el.dataset.day,slot:next});drawProviderWeek()}catch(e){toast(e.message)}})}
async function renderCalendars(){let c=$('content');c.innerHTML=`<div class="grid"><section class="card"><h3>Importer les occupations ICS</h3><p>Un fichier ICS remplacera les occupations issues d'un précédent import ICS pour la ressource choisie ; les réservations confirmées sont préservées.</p><div class="field"><label>Ressource</label><select id="icsResource">${resources.map(r=>`<option value="${r.id}">${r.name}</option>`)}</select></div><div class="field"><label>Fichier .ics</label><input type="file" id="icsFile" accept=".ics,text/calendar"></div><button class="btn" id="importBtn">Importer l'ICS</button></section><section class="card"><h3>Occupation d'une ressource</h3><div class="field"><label>Ressource</label><select id="busyResource">${resources.map(r=>`<option value="${r.id}">${r.name}</option>`)}</select></div><div id="busyList"></div></section></div>`;$('busyResource').onchange=drawBusy;$('importBtn').onclick=async()=>{try{let f=$('icsFile').files[0];if(!f)throw Error('Sélectionnez un fichier ICS');let fd=new FormData();fd.append('file',f);let result=await api('import-ics/'+$('icsResource').value,'POST',fd);toast(result.imported+' occupations importées');$('busyResource').value=$('icsResource').value;drawBusy()}catch(e){toast(e.message)}};drawBusy()}
async function drawBusy(){let data=await api('availability/'+$('busyResource').value);$('busyList').innerHTML=data.busy.length?data.busy.slice(0,40).map(b=>`<div class="row"><div><b>${escapeHTML(b.title)}</b><div class="hint">${escapeHTML(b.start.slice(0,16))} → ${escapeHTML(b.end.slice(0,16))}</div></div><span class="pill">${b.source}</span></div>`).join(''):'<div class="empty">Aucune occupation</div>'}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x===b));$('title').textContent={cdp:'Planification CDP',providers:'Portail prestataires',trainer:'Espace formateur',calendars:'Agendas & import ICS',about:'À propos'}[tab];render()});const retiredReset=async()=>{if(!confirm('Réinitialiser toutes les données de démonstration ?'))return;await api('reset','POST');toast('Données fictives réinitialisées');render()};(async()=>{try{resources=await api('resources');render()}catch(e){toast(e.message)}})();
</script></body></html>
